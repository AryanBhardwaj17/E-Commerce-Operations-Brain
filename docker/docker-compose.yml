services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - app_runtime_data:/app/.runtime
    environment:
      - DATABASE_URL=postgresql://ops:ops@postgres:5432/ops_brain
      - CHECKPOINT_BACKEND=${CHECKPOINT_BACKEND:-auto}
      - REPOSITORY_BACKEND=${REPOSITORY_BACKEND:-postgres}
      - REPOSITORY_SCHEMA=${REPOSITORY_SCHEMA:-commerce}
      - EXECUTION_BACKEND=queued
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - API_KEY=${API_KEY:-dev-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - RUNTIME_STORE_DIR=${RUNTIME_STORE_DIR:-/app/.runtime}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    command: ["eob-worker"]
    volumes:
      - app_runtime_data:/app/.runtime
    environment:
      - DATABASE_URL=postgresql://ops:ops@postgres:5432/ops_brain
      - CHECKPOINT_BACKEND=${CHECKPOINT_BACKEND:-auto}
      - REPOSITORY_BACKEND=${REPOSITORY_BACKEND:-postgres}
      - REPOSITORY_SCHEMA=${REPOSITORY_SCHEMA:-commerce}
      - EXECUTION_BACKEND=queued
      - WORKER_POLL_INTERVAL_SECONDS=${WORKER_POLL_INTERVAL_SECONDS:-1.0}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - API_KEY=${API_KEY:-dev-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - RUNTIME_STORE_DIR=${RUNTIME_STORE_DIR:-/app/.runtime}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP_WORKSPACE: "@eob/store-owner-assistant"
    ports:
      - "3000:3000"
    environment:
      - APP_WORKSPACE=@eob/store-owner-assistant
      - EOB_API_BASE_URL=http://app:8000
      - EOB_API_KEY=${API_KEY:-dev-secret}
      - HOSTNAME=0.0.0.0
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops_brain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus metrics exporter
    restart: unless-stopped

volumes:
  app_runtime_data:
  chromadb_data:
  postgres_data:
